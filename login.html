  <script>
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);

      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');

      if (isLogin) {
        tabLoginBtn.className = 'py-2 rounded-lg font-bold text-xs uppercase tracking-wider bg-maroon text-cream-light shadow transition-all';
        tabRegisterBtn.className = 'py-2 rounded-lg font-bold text-xs uppercase tracking-wider text-maroon hover:text-gold transition-all';
      } else {
        tabRegisterBtn.className = 'py-2 rounded-lg font-bold text-xs uppercase tracking-wider bg-maroon text-cream-light shadow transition-all';
        tabLoginBtn.className = 'py-2 rounded-lg font-bold text-xs uppercase tracking-wider text-maroon hover:text-gold transition-all';
      }
    }

    function fillDemo() {
      document.getElementById('loginIdentifier').value = 'demo@chipburger.com';
      document.getElementById('loginPassword').value = 'password123';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('loginIdentifier').value.trim();
      const pass = document.getElementById('loginPassword').value;

      // Check Owner / Admin credentials directly
      if (id.toLowerCase() === 'warisulzaim@gmail.com' && pass === 'Zaimajaya_12') {
        const ownerUser = {
          name: 'Warisul Zaim (Owner)',
          email: 'warisulzaim@gmail.com',
          phone: '082284362199',
          role: 'admin'
        };
        localStorage.setItem('chipburger_admin', 'warisulzaim@gmail.com');
        localStorage.setItem('chipburger_user', JSON.stringify(ownerUser));
        showAlert('Login Pemilik Berhasil! Mengalihkan ke Portal Admin...', 'bg-gold text-maroon border border-gold font-black');
        setTimeout(() => window.location.href = 'admin.html', 800);
        return;
      }

      // Try API Login
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emailOrUser: id, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          if (data.user.email.toLowerCase() === 'warisulzaim@gmail.com' && data.user.role === 'admin') {
            localStorage.setItem('chipburger_admin', 'warisulzaim@gmail.com');
            localStorage.setItem('chipburger_user', JSON.stringify(data.user));
            showAlert('Login Pemilik Berhasil! Mengalihkan ke Portal Admin...', 'bg-gold text-maroon border border-gold font-black');
            setTimeout(() => window.location.href = 'admin.html', 800);
            return;
          }
          localStorage.removeItem('chipburger_admin');
          localStorage.setItem('chipburger_user', JSON.stringify(data.user));
          showAlert('Login berhasil! Mengalihkan ke menu...', 'bg-green-100 text-green-800 border border-green-300');
          setTimeout(() => window.location.href = 'index.html', 800);
          return;
        } else {
          showAlert(data.message || 'Login gagal.', 'bg-red-100 text-red-800 border border-red-300');
          return;
        }
      } catch (err) {
        // Fallback offline for customer
      }

      // Local fallback for regular customer
      const user = {
        name: id.includes('@') ? id.split('@')[0] : 'Pelanggan Setia',
        email: id,
        phone: '082284362199',
        role: 'customer'
      };
      localStorage.removeItem('chipburger_admin');
      localStorage.setItem('chipburger_user', JSON.stringify(user));
      showAlert('Login berhasil! Mengalihkan ke menu...', 'bg-green-100 text-green-800 border border-green-300');
      setTimeout(() => window.location.href = 'index.html', 800);
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();

      const user = { name, phone, email };
      localStorage.setItem('chipburger_user', JSON.stringify(user));
      showAlert('Registrasi berhasil! Selamat datang di Chip Burger.', 'bg-green-100 text-green-800 border border-green-300');
      setTimeout(() => window.location.href = 'index.html', 800);
    }

    function showAlert(msg, classes) {
      const alert = document.getElementById('authAlert');
      alert.className = `mb-4 p-3 rounded-lg text-xs font-bold text-center ${classes}`;
      alert.textContent = msg;
      alert.classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>

</body>
